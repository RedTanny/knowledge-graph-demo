apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: knowledge-graph-demo
  namespace: ai5-marketplace
  title: Knowledge Graph Demo
  description: >
    Persistent local knowledge graph demo. Ingests meeting notes into a
    Memory-MCP-backed graph (data/memory.jsonl) and recalls decisions,
    ownership, and technical choices in a completely fresh agent session —
    no re-pasted context required.
  tags:
    - ai-skill
    - memory
    - knowledge-graph
    - demo
  annotations:
    agentic-plugins.redhat.com/version: "1.0.0"
    agentic-plugins.redhat.com/repo: "knowledge-graph-demo"
    agentic.redhat.com/lola-module: "true"
    agentic.redhat.com/lola-module-name: knowledge-graph-demo
    agentic.redhat.com/repository: https://github.com/RedTanny/knowledge-graph-demo
    agentic.redhat.com/path: .
    github.com/project-slug: RedTanny/knowledge-graph-demo
  links:
    - url: https://github.com/RedTanny/knowledge-graph-demo
      title: Source Repository
      icon: github
spec:
  type: plugin
  lifecycle: development
  owner: group:redhat/ai5-marketplace
  system: default/knowledge-graph-demo
  disciplines:
    - productivity
  categories:
    - memory
    - demo
  agents: []
  dependsOn:
    - mcpserver:ai5-marketplace/memory-mcp-server
  dependencyOf:
    - airesource:ai5-marketplace/agent-memory
